<div class="field">
  <label [for]="selectId">{{ label() }}</label>
  <div class="select-wrap">
    <select
      [id]="selectId"
      [value]="value()"
      (change)="value.set($any($event.target).value)"
    >
      @for (option of options(); track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>
</div>
